services:
  jenkins:
    build: .                 # build local Dockerfile (Jenkins + Linux docker CLI)
    container_name: jenkins
    user: root               # so the jenkins process can access the docker socket
    ports:
      - "8081:8080"      # веб-інтерфейс Jenkins
      - "50001:50000"    # агентський порт
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # доступ до Docker на хості
    restart: unless-stopped

volumes:
  jenkins_home:
