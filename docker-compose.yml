services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8081:8080"
      - "50001:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker   # для Linux
      - "C:/Program Files/Docker/Docker/resources/bin/docker.exe:/usr/bin/docker.exe" # для Windows
    restart: unless-stopped

volumes:
  jenkins_home:
