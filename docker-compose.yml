version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8081:8080"      # веб-інтерфейс Jenkins
      - "50000:50000"    # агентський порт
    volumes:
      - jenkins_home:/var/jenkins_home   # збереження даних Jenkins
      - /var/run/docker.sock:/var/run/docker.sock  # доступ до Docker хоста
      - /usr/bin/docker:/usr/bin/docker            # клієнт docker всередині контейнера
    restart: unless-stopped

volumes:
  jenkins_home:
